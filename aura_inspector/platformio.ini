[env:esp32-wrover]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Esquema de partición para dar espacio a la cámara
board_build.partitions = huge_app.csv

; Habilitar memoria PSRAM para la Freenove ESP32-WROVER-CAM
build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue